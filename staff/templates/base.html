<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Maitred Staff{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #222; }
    nav { background: #1a1a1a; color: #fff; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    nav a { color: #ccc; text-decoration: none; margin-left: 1.25rem; font-size: 0.9rem; }
    nav a:hover { color: #fff; }
    nav .brand { font-weight: 700; font-size: 1.1rem; color: #fff; letter-spacing: 0.02em; }
    .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1.25rem; }
    h2 { font-size: 1.1rem; margin-bottom: 0.75rem; color: #444; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th { background: #f0f0f0; text-align: left; padding: 0.6rem 0.9rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; }
    td { padding: 0.65rem 0.9rem; border-top: 1px solid #eee; font-size: 0.9rem; vertical-align: middle; }
    tr:hover td { background: #fafafa; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .btn { display: inline-block; padding: 0.4rem 0.9rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; border: none; text-decoration: none; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
    .card { background: #fff; border-radius: 6px; padding: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 1rem; }
    .stat { font-size: 2rem; font-weight: 700; color: #2563eb; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: #555; }
    input[type=text], input[type=password], input[type=time], input[type=number], input[type=date] {
      width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem;
    }
    .form-group { margin-bottom: 1rem; }
    .alert { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .toggle-form { display: inline; }
  </style>
</head>
<body>
{% if session %}
<nav>
  <span class="brand">Maitred</span>
  <div>
    <a href="/staff/">Dashboard</a>
    <a href="/staff/reservations">Reservations</a>
    {% if session.role in ('manager', 'owner') %}
    <a href="/staff/settings">Settings</a>
    {% endif %}
    <form method="post" action="/staff/logout" style="display:inline">
      <button type="submit" style="background:none;border:none;color:#ccc;cursor:pointer;font-size:0.9rem;margin-left:1.25rem;">Logout</button>
    </form>
  </div>
</nav>
{% endif %}
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
