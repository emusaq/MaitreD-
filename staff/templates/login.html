<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maitred — Staff Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; padding: 2.5rem 2rem; width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
    h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: #555; }
    input { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #2563eb; }
    button { width: 100%; padding: 0.6rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    .alert { padding: 0.65rem 0.9rem; background: #fee2e2; color: #991b1b; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1rem; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Maitred</h1>
    <p class="subtitle">Front of house staff portal</p>
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/staff/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
